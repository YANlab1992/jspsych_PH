<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UPI 心理健康全景测评 · 网易云心理实验室</title>

  <!-- jsPsych 7 核心库与插件 -->
  <script src="dist/jspsych.js"></script>
  <link rel="stylesheet" href="dist/jspsych.css" />
  <script src="dist/plugin-html-button-response.js"></script>

  <!-- Chart.js 用于五维心理雷达图 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --netease-red: #e60026;
      --netease-red-light: #ff3a3a;
      --netease-pink: #ff7b7b;
      --bg-deep: #090c14;
      --bg-card: rgba(20, 24, 36, 0.78);
      --border-glass: rgba(255, 255, 255, 0.08);
      --border-red: rgba(255, 58, 58, 0.38);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-deep);
      background-image:
        radial-gradient(circle at 12% 18%, rgba(230, 0, 38, 0.14) 0%, transparent 42%),
        radial-gradient(circle at 88% 82%, rgba(255, 58, 58, 0.09) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, #111625 0%, #07090f 100%);
      color: var(--text-main);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      overflow-x: hidden;
    }

    /* jsPsych 容器玻璃拟态重写 */
    .jspsych-content-wrapper {
      background: transparent !important;
      padding: 0 !important;
      width: 100%;
    }

    .jspsych-content {
      max-width: 780px !important;
      width: 100%;
      margin: 0 auto !important;
      background: var(--bg-card) !important;
      backdrop-filter: blur(24px) !important;
      -webkit-backdrop-filter: blur(24px) !important;
      border: 1px solid var(--border-glass) !important;
      border-radius: 26px !important;
      padding: 46px 42px !important;
      box-shadow:
        0 32px 64px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.1) !important;
      position: relative;
      overflow: hidden;
      text-align: left !important;
      animation: cardFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardFadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      .jspsych-content {
        padding: 32px 22px !important;
        border-radius: 20px !important;
      }
    }

    /* 顶部网易云流光进度条 */
    .progress-container {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.06);
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--netease-red), var(--netease-red-light), var(--netease-pink));
      box-shadow: 0 0 12px rgba(255, 58, 58, 0.55);
      transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 顶部品牌角标 */
    .brand-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .brand-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--netease-pink);
      font-weight: 600;
      background: rgba(255, 58, 58, 0.1);
      border: 1px solid rgba(255, 58, 58, 0.22);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
    }

    .brand-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--netease-red-light);
      box-shadow: 0 0 8px var(--netease-red-light);
    }

    /* 欢迎页样式 */
    .welcome-box {
      text-align: center;
      padding: 6px 0 10px;
    }

    .welcome-vinyl {
      width: 88px;
      height: 88px;
      margin: 0 auto 22px;
      border-radius: 50%;
      background: radial-gradient(circle, #2b2b2b 0%, #121212 64%, #050505 100%);
      border: 2px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 12px 30px rgba(230, 0, 38, 0.28);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: rotateDisc 14s linear infinite;
    }

    .welcome-vinyl::before {
      content: "♪";
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--netease-red-light), var(--netease-red));
      color: #fff;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(255, 255, 255, 0.85);
    }

    .welcome-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 10px;
    }

    .welcome-subtitle {
      font-size: 13px;
      color: var(--netease-pink);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 24px;
      font-weight: 600;
    }

    .welcome-desc {
      color: var(--text-sub);
      font-size: 15px;
      line-height: 1.85;
      max-width: 580px;
      margin: 0 auto 26px;
      text-align: justify;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 20px 24px;
    }

    .welcome-desc b {
      color: #f1f5f9;
      font-weight: 600;
    }

    .welcome-highlights {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-width: 580px;
      margin: 0 auto 30px;
    }

    .highlight-item {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 12px 10px;
      text-align: center;
    }

    .highlight-num {
      font-size: 18px;
      font-weight: 700;
      color: var(--netease-red-light);
      margin-bottom: 4px;
    }

    .highlight-label {
      font-size: 12px;
      color: var(--text-sub);
    }

    /* 题目页样式 */
    .question-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .question-counter {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-sub);
    }

    .question-counter strong {
      color: var(--netease-red-light);
      font-size: 18px;
    }

    .dim-pill {
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
    }

    .question-box {
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 20px;
      padding: 36px 28px;
      margin-bottom: 28px;
      text-align: center;
      position: relative;
    }

    .question-prompt-hint {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .question-title {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.5;
      letter-spacing: 0.01em;
    }

    .kbd-hint {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 18px;
    }

    /* 按钮组与迫选卡片样式 */
    #jspsych-html-button-response-btngroup {
      display: flex !important;
      flex-direction: row !important;
      justify-content: center !important;
      gap: 18px !important;
      width: 100% !important;
      margin: 0 auto !important;
    }

    .jspsych-html-button-response-button {
      flex: 1 !important;
      margin: 0 !important;
    }

    .jspsych-btn {
      width: 100% !important;
      padding: 18px 20px !important;
      background: rgba(255, 255, 255, 0.04) !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      color: #e2e8f0 !important;
      font-size: 16px !important;
      font-family: inherit !important;
      font-weight: 600 !important;
      border-radius: 16px !important;
      cursor: pointer !important;
      transition: all 0.22s cubic-bezier(0.25, 1, 0.5, 1) !important;
      text-align: center !important;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2) !important;
      line-height: 1.4 !important;
    }

    .jspsych-btn:hover {
      background: rgba(255, 58, 58, 0.12) !important;
      border-color: var(--netease-red-light) !important;
      color: #ffffff !important;
      box-shadow:
        0 0 24px rgba(255, 58, 58, 0.22),
        0 8px 20px rgba(0, 0, 0, 0.3) !important;
      transform: translateY(-2px);
    }

    .jspsych-btn:active {
      transform: translateY(1px) !important;
    }

    /* 单按钮（开始测评 / 重新测评）主推网易红渐变样式 */
    #jspsych-html-button-response-btngroup:has(> :only-child) {
      max-width: 260px !important;
    }

    #jspsych-html-button-response-btngroup:has(> :only-child) .jspsych-btn {
      background: linear-gradient(135deg, var(--netease-red-light) 0%, var(--netease-red) 100%) !important;
      border: none !important;
      color: #ffffff !important;
      font-weight: 700 !important;
      letter-spacing: 0.5px !important;
      border-radius: 999px !important;
      padding: 15px 32px !important;
      box-shadow: 0 10px 25px rgba(230, 0, 38, 0.38) !important;
    }

    #jspsych-html-button-response-btngroup:has(> :only-child) .jspsych-btn:hover {
      box-shadow: 0 12px 30px rgba(255, 58, 58, 0.55) !important;
      transform: translateY(-2px);
    }

    /* ================= 结果页样式 ================= */
    .result-header {
      text-align: center;
      margin-bottom: 28px;
      padding-bottom: 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }

    .result-eyebrow {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      color: var(--netease-pink);
      font-weight: 600;
      margin-bottom: 8px;
    }

    .persona-name {
      font-size: 36px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 0%, #ffd6d6 50%, var(--netease-pink) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      filter: drop-shadow(0 4px 14px rgba(255, 58, 58, 0.25));
    }

    .status-badge-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .level-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }

    .level-1 {
      background: rgba(239, 68, 68, 0.16);
      border: 1px solid rgba(239, 68, 68, 0.45);
      color: #fca5a5;
    }

    .level-2 {
      background: rgba(245, 158, 11, 0.16);
      border: 1px solid rgba(245, 158, 11, 0.45);
      color: #fcd34d;
    }

    .level-3 {
      background: rgba(16, 185, 129, 0.16);
      border: 1px solid rgba(16, 185, 129, 0.45);
      color: #6ee7b7;
    }

    .score-pill {
      display: inline-flex;
      align-items: center;
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 13px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
    }

    .score-pill strong {
      color: var(--netease-red-light);
      margin: 0 4px;
    }

    .persona-desc {
      font-size: 14px;
      line-height: 1.85;
      color: #cbd5e1;
      text-align: justify;
      max-width: 650px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.025);
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 16px 20px;
    }

    /* 双栏：雷达图 + 网易云黑胶音乐热评 */
    .result-details {
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
      width: 100%;
    }

    @media (max-width: 720px) {
      .result-details {
        grid-template-columns: 1fr;
      }
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 20px;
      padding: 20px;
    }

    .panel-title {
      font-size: 14px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .panel-title span {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .music-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* 网易云黑胶唱片旋转动画 */
    .vinyl-container {
      position: relative;
      width: 116px;
      height: 116px;
      margin-bottom: 14px;
    }

    .vinyl-disc {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, #2d2d2d 0%, #111111 65%, #000000 100%);
      border-radius: 50%;
      position: relative;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.55);
      animation: rotateDisc 12s linear infinite;
      border: 2px solid rgba(255, 255, 255, 0.12);
    }

    .vinyl-disc::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--netease-red-light), var(--netease-red));
      border-radius: 50%;
      border: 2px solid #ffffff;
      box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.35);
    }

    .vinyl-disc::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 10px;
      height: 10px;
      background: var(--bg-deep);
      border-radius: 50%;
    }

    @keyframes rotateDisc {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .song-info {
      text-align: center;
      margin-bottom: 14px;
    }

    .song-title {
      font-size: 15px;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 3px;
    }

    .song-artist {
      font-size: 12px;
      color: var(--text-sub);
    }

    .quote-box {
      background: rgba(255, 58, 58, 0.05);
      border-left: 3px solid var(--netease-red-light);
      border-radius: 4px 14px 14px 4px;
      padding: 13px 16px;
      font-style: italic;
      font-size: 13px;
      color: #e2e8f0;
      line-height: 1.65;
      text-align: justify;
      width: 100%;
    }

    .quote-author {
      font-size: 11px;
      color: var(--netease-pink);
      text-align: right;
      margin-top: 6px;
      font-style: normal;
    }

    /* 五维分项指标进度条 */
    .dim-bars-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .dim-bar-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .dim-bar-label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #cbd5e1;
    }

    .dim-bar-label strong {
      color: #f8fafc;
    }

    .dim-bar-track {
      width: 100%;
      height: 7px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 999px;
      overflow: hidden;
    }

    .dim-bar-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--netease-red), var(--netease-pink));
      transition: width 0.6s ease;
    }

    /* 四大关键预警题目看板 (第8、16、25、26题) */
    .key-items-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    @media (max-width: 600px) {
      .key-items-grid {
        grid-template-columns: 1fr;
      }
    }

    .key-item-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 13px 15px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .key-item-card.alert {
      background: rgba(230, 0, 38, 0.07);
      border-color: rgba(255, 58, 58, 0.32);
    }

    .key-item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      color: #f1f5f9;
    }

    .key-choice-tag {
      font-size: 11px;
      padding: 2px 9px;
      border-radius: 999px;
      font-weight: 700;
    }

    .key-choice-yes {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .key-choice-no {
      background: rgba(16, 185, 129, 0.16);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.35);
    }

    .key-item-desc {
      font-size: 12px;
      color: var(--text-sub);
      line-height: 1.5;
    }

    /* 心理教授调适处方 */
    .prescription-box {
      background: linear-gradient(135deg, rgba(230, 0, 38, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
      border: 1px solid rgba(255, 58, 58, 0.22);
      border-radius: 18px;
      padding: 18px 22px;
      margin-bottom: 28px;
    }

    .prescription-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--netease-pink);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .prescription-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 13.5px;
      color: #e2e8f0;
      line-height: 1.7;
    }

    /* 潜意识反应时探针与信效度卡片 */
    .metrics-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    @media (max-width: 600px) {
      .metrics-row {
        grid-template-columns: 1fr;
      }
    }

    .metric-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 14px 16px;
      text-align: center;
    }

    .metric-val {
      font-size: 20px;
      font-weight: 800;
      color: var(--netease-red-light);
      margin-bottom: 4px;
    }

    .metric-label {
      font-size: 12px;
      color: var(--text-sub);
    }

    /* 黑胶唱针与播放交互 */
    .vinyl-container {
      cursor: pointer;
      transition: transform 0.25s ease;
    }

    .vinyl-container:hover {
      transform: scale(1.05);
    }

    .vinyl-disc.paused {
      animation-play-state: paused;
    }

    .vinyl-play-hint {
      font-size: 11px;
      color: var(--netease-pink);
      margin-bottom: 10px;
      background: rgba(255, 58, 58, 0.1);
      border: 1px solid rgba(255, 58, 58, 0.25);
      padding: 3px 10px;
      border-radius: 999px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
    }

    .vinyl-play-hint:hover {
      background: rgba(255, 58, 58, 0.22);
    }

    /* 结果页底部工具栏按钮 */
    .result-actions-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .util-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 18px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .util-btn:hover {
      background: rgba(255, 58, 58, 0.12);
      border-color: var(--netease-red-light);
      color: #ffffff;
    }
  </style>
</head>

<body>
<script>
/**
 * ============================================================================
 * UPI (University Personality Inventory) 大学生人格健康调查表 · 60题标准矩阵
 * ----------------------------------------------------------------------------
 * 维度划分（心理学量表结构）：
 * - SOM (Somatic 躯体化与生理警讯, 16题): 1-4, 16-19, 31-34, 46-49
 * - DEP (Depressive 情绪低落与抑郁倾向, 10题): 6, 7, 8, 9, 12, 13, 15, 25, 26, 60
 * - ANX (Anxiety 焦虑与神经质反应, 10题): 21, 22, 23, 24, 36, 37, 38, 39, 44, 45

// 计算总分、维度得分及 UPI 三级心理健康状态
const calculateResults = function() {
  const trials = jsPsych.data.get().filter({task: "question"}).values();

  // 标准 UPI 计分：前56道症状题（剔除第5、20、35、50题4道测谎/积极效度题）选“是”计1分
  // 同时兼容反向计分含积极题的综合分与分维度统计
  let symptomScore = 0;
  let positiveScore = 0; // 4道正向题（5, 20, 35, 50）选“是”的个数（满分为4，代表积极状态）
  const dimScores = { SOM: 0, DEP: 0, ANX: 0, COG: 0, INT: 0, POS: 0 };

  trials.forEach(t => {
    const isYes = (t.response === 0);
    if (t.dim === "POS") {
      if (isYes) positiveScore += 1;
      dimScores.POS += isYes ? 1 : 0;
    } else {
      if (isYes) {
        symptomScore += 1;
        dimScores[t.dim] += 1;
      }
    }
  });

  const totalScore = symptomScore;

  // 获取第25题、第8题、第16题和第26题的选择结果
  const getChoiceText = (idx) => {
    const found = jsPsych.data.get().filter({task: "question", index: idx}).values()[0];
    return (found && found.response === 0) ? "是" : "否";
  };

  const q25Result = getChoiceText(25);
  const q8Result  = getChoiceText(8);
  const q16Result = getChoiceText(16);
  const q26Result = getChoiceText(26);

  // UPI 严格三级筛选标准
  let healthStatus = "无明显心理问题（III类 · 心理健康状态良好）";
  let levelClass = "level-3";
  let levelCode = 3;

  if (totalScore >= 25 || q25Result === "是") {
    healthStatus = "有比较严重的心理困扰，建议尽快进行专业心理咨询（I类 · 重点关注）";
    levelClass = "level-1";
    levelCode = 1;
  } else if (
    (totalScore >= 20 && totalScore < 25) ||
    q8Result === "是" ||
    q16Result === "是" ||
    q26Result === "是"
  ) {
    healthStatus = "有轻微的心理困扰，需要关注自身的心理健康与情绪调节（II类 · 次重点关注）";
    levelClass = "level-2";
    levelCode = 2;
  }

  // 计算主导压力维度（按得分占该维度满分比例最高者）
  const symptomDims = ["SOM", "DEP", "ANX", "COG", "INT"];
  let topDim = "SOM";
  let topRatio = -1;
  symptomDims.forEach(d => {
    const ratio = dimScores[d] / dimMeta[d].max;
    if (ratio > topRatio) {
      topRatio = ratio;
      topDim = d;
    }
  });

  // 匹配网易云风格画像
  let profile = stateProfiles.LEVEL_3;
  if (levelCode === 1) {
    profile = stateProfiles.LEVEL_1;
  } else if (levelCode === 2 || topRatio >= 0.35) {
    profile = stateProfiles[`LEVEL_2_${topDim}`] || stateProfiles.LEVEL_2_DEP;
  }

  // 计算反应时（RT）与潜意识犹豫探针（最长反应时题目）
  let totalRtMs = 0;
  let maxRtItem = null;
  trials.forEach(t => {
    const rt = t.rt || 0;
    totalRtMs += rt;
    if (!maxRtItem || rt > maxRtItem.rt) {
      maxRtItem = t;
    }
  });
  const avgRtSec = trials.length > 0 ? (totalRtMs / trials.length / 1000).toFixed(2) : "0.00";
  const totalTimeSec = Math.round(totalRtMs / 1000);

  return {
    healthStatus,
    levelClass,
    levelCode,
    totalScore,
    positiveScore,
    dimScores,
    topDim,
    profile,
    q25Result,
    q8Result,
    q16Result,
    q26Result,
    avgRtSec,
    totalTimeSec,
    maxRtItem
  };
};

// Web Audio API 网易云轻音律合成器（零外部音频依赖，离线可用）
let audioCtx = null;
let bgmInterval = null;
let isPlayingBgm = false;

function toggleHealingBgm() {
  const disc = document.getElementById('resultVinylDisc');
  const hint = document.getElementById('vinylPlayHint');
  if (isPlayingBgm) {
    if (bgmInterval) clearInterval(bgmInterval);
    bgmInterval = null;
    isPlayingBgm = false;
    if (disc) disc.classList.add('paused');
    if (hint) hint.innerHTML = '▶ 点击黑胶播放疗愈环境音';
    return;
  }

  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if (!AudioContextClass) return;
  if (!audioCtx) audioCtx = new AudioContextClass();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  // 温暖的大七和弦五声音阶频率 (C4, E4, G4, B4, D5, E5)
  const notes = [261.63, 329.63, 392.00, 493.88, 587.33, 659.25];
  const playSoftNote = () => {
    if (!isPlayingBgm || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    const freq = notes[Math.floor(Math.random() * notes.length)];
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

    gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.045, audioCtx.currentTime + 0.4);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2.8);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 2.9);
  };

  isPlayingBgm = true;
  if (disc) disc.classList.remove('paused');
  if (hint) hint.innerHTML = '⏸ 正在播放云村疗愈声波（点击暂停）';
  playSoftNote();
  bgmInterval = setInterval(playSoftNote, 1400);
}

// 导出 CSV 原始作答与反应时数据（供心理学研究与留档使用）
function exportUpiCsv() {
  const trials = jsPsych.data.get().filter({task: "question"}).values();
  const rows = [
    ["题号", "题目内容", "所属维度", "计分键", "被试选择", "症状计分", "反应时(ms)"]
  ];
  trials.forEach(t => {
    rows.push([
      t.index,
      `"${t.question_text}"`,
      t.dim,
      t.key,
      t.chosen,
      t.score,
      t.rt
    ]);
  });
  const csvContent = "\uFEFF" + rows.map(r => r.join(",")).join("\n");
  const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `UPI_心理健康测评数据_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

        } else if (e.key === '2' || e.key === 'ArrowRight') {

          btns[1].click();
        }
      };
      window.addEventListener('keydown', keyHandler);
    },

      const chosen = (data.response === 0) ? "是" : "否";
      data.chosen = chosen;
      data.score = (chosen === data.key) ? 1 : 0;
